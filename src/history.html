<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>WatchHistory for YouTube™ - History</title>
  <link rel="stylesheet" href="shared/theme.css">
</head>

<body>
  <!-- Header -->
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">WHYT</div>
      <div class="logo-text">WatchHistory <span>for YouTube™</span></div>
    </div>
    <nav class="nav-tabs">
      <a href="history.html" class="nav-tab active">History</a>
      <a href="timeline.html" class="nav-tab">Timeline</a>
      <a href="stats.html" class="nav-tab">Stats</a>
      <a href="options.html" class="nav-tab">Options</a>
      <a href="how-it-works.html" class="nav-tab">How it works</a>
      <a href="https://www.youtube.com" class="nav-tab" target="_blank" rel="noopener noreferrer">YouTube</a>
    </nav>
    <div class="page-header-actions">
      <button id="clear-all" class="btn btn-danger btn-sm">Clear All</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stat-bar">
    <span class="stat-item">Total Archived: <strong id="stat-total">0</strong></span>
  </div>

  <!-- Search & Filter -->
  <div class="search-bar">
    <input type="text" id="search-input" class="input input-search" placeholder="Search by title or channel...">
    <label class="hide-watched-label">
      <input type="checkbox" id="hide-watched-toggle">
      <span>Hide watched</span>
    </label>
    <select id="sort-select" class="sort-select">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="title">Title A–Z</option>
    </select>
  </div>

  <!-- Video Grid -->
  <div id="history-container" class="video-grid"></div>

  <!-- Load More -->
  <div class="load-more-wrap">
    <button id="load-more-btn" class="btn hidden">Load More</button>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Footer -->
  <div
    class="page-footer">
    <div class="page-footer-title">WatchHistory for YouTube™ v<span id="version-number">—</span></div>
    <div class="page-footer-description">Tracks YouTube videos locally and resumes where you left off.</div>
    <a href="https://github.com/GeorgeElliott/yt-watch-history" target="_blank"
      class="page-footer-link">View on GitHub</a>
    <span class="page-footer-divider">|</span>
    <a href="https://ytwatchhistory.com" target="_blank" rel="noopener noreferrer"
      class="page-footer-link">Visit Website</a>
    <span class="page-footer-divider">|</span>
    <a href="https://github.com/GeorgeElliott/yt-watch-history/issues" target="_blank" rel="noopener noreferrer"
      class="page-footer-link">Report a Bug</a>
  </div>

  <script src="core/core.js"></script>
  <script src="core/db.js"></script>
  <script src="history.js"></script>
</body>

</html>
