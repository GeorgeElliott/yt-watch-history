<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="shared/theme.css">
  <script src="libraries/webextension-polyfill.js"></script>
</head>

<body class="popup-page">
  <!-- Header -->
  <div class="popup-header">
    <div class="logo-icon">WHYT</div>
    <div class="title">WatchHistory <span>for YouTube™</span></div>
    <a class="popup-youtube-link" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">Open YouTube</a>
  </div>

  <!-- Navigation Links -->
  <div class="popup-nav">
    <a href="history.html" target="_blank" id="open-history">
      <span class="nav-icon">📋</span> History
    </a>
    <a href="timeline.html" target="_blank" id="open-timeline">
      <span class="nav-icon">🕒</span> Timeline
    </a>
    <a href="stats.html" target="_blank" id="open-stats">
      <span class="nav-icon">📊</span> Stats
    </a>
    <a href="options.html" target="_blank" id="open-options">
      <span class="nav-icon">⚙️</span> Options
    </a>
  </div>
  <!-- Stats Bar: Ghost Mode (left) + Stats (right) -->
  <div class="stats-bar">
    <!-- Left column: Ghost Mode -->
    <div class="stats-col">
      <div class="ghost-control">
        <span>Ghost Mode</span>
        <span class="ghost-info" tabindex="0" role="img" aria-label="Pauses tracking until browser restart">ⓘ
          <span class="ghost-tooltip">Pauses tracking until browser restart</span>
        </span>
        <label class="toggle" aria-label="Ghost Mode">
          <input type="checkbox" id="ghostModeToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Middle column: empty -->
    <div class="stats-col"></div>

    <!-- Right column: Stats -->
    <div class="stats-col">
      <div class="popup-stats">
        <span class="stat-text">Total Archived: <strong id="stat-count">0</strong></span>
      </div>
    </div>
  </div>

  <div class="popup-main">
    <!-- Recent Videos -->
    <div class="popup-section-label">Recent</div>
    <div id="history-list"></div>
    <button id="show-more-btn" class="btn btn-sm hidden show-more-button">Show More</button>
  </div>

  <script src="core/core.js"></script>
  <script src="core/db.js"></script>
  <script src="popup.js"></script>
</body>

</html>
