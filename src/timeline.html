<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>WatchHistory for YouTube™ - Timeline</title>
  <link rel="stylesheet" href="shared/theme.css">
</head>

<body>
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">WHYT</div>
      <div class="logo-text">WatchHistory <span>for YouTube™</span></div>
    </div>
    <nav class="nav-tabs">
      <a href="history.html" class="nav-tab">History</a>
      <a href="timeline.html" class="nav-tab active">Timeline</a>
      <a href="stats.html" class="nav-tab">Stats</a>
      <a href="options.html" class="nav-tab">Options</a>
      <a href="how-it-works.html" class="nav-tab">How it works</a>
      <a href="https://www.youtube.com" class="nav-tab" target="_blank" rel="noopener noreferrer">YouTube</a>
    </nav>
  </div>

  <main class="timeline-container">
    <div class="timeline-heading-row">
      <div class="timeline-intro">
        <h1>Watch timeline</h1>
        <p>Your saved YouTube history, in chronological order.</p>
      </div>
      <div class="timeline-date-picker">
        <div class="timeline-controls">
          <select id="timeline-month-picker" class="timeline-picker" aria-label="Month" disabled>
            <option>Loading...</option>
          </select>
          <select id="timeline-year-picker" class="timeline-picker" aria-label="Year" disabled>
            <option>Loading...</option>
          </select>
          <button id="timeline-go-button" class="btn btn-sm" type="button" disabled>Go</button>
        </div>
      </div>
    </div>
    <div id="timeline" aria-live="polite"></div>
    <div id="timeline-loading" class="timeline-loading">Loading timeline...</div>
    <div id="timeline-sentinel" class="timeline-sentinel" aria-hidden="true"></div>
  </main>

  <!-- Footer -->
  <footer
    class="page-footer">
    <div class="page-footer-title">WatchHistory for YouTube™ v<span id="version-number">—</span></div>
    <div class="page-footer-description">Tracks YouTube videos locally and resumes where you left off.</div>
    <a href="https://github.com/GeorgeElliott/yt-watch-history" target="_blank" rel="noopener noreferrer"
      class="page-footer-link">View on GitHub</a>
    <span class="page-footer-divider">|</span>
    <a href="https://github.com/GeorgeElliott/yt-watch-history/issues" target="_blank" rel="noopener noreferrer"
      class="page-footer-link">Report a Bug</a>
  </footer>

  <script src="core/core.js"></script>
  <script src="core/db.js"></script>
  <script src="timeline.js"></script>
</body>

</html>
